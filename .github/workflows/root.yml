name: Deploy Tests

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

jobs:
  test:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{github.event.pull_request.head.sha || github.sha}}

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org/

      - name: Install
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Docker Build
        run: |
          for arch in amd64 arm64; do
            docker build --platform "linux/$arch" -t "media-infra:test-$arch" .
          done

      - name: Docker Smoke Test
        run: |
          for arch in amd64 arm64; do
            docker run --rm --platform "linux/$arch" --entrypoint node "media-infra:test-$arch" -v
          done
